{% extends 'base.html' %}
{% block title %}Login{% endblock title %}
{% block main %}
<style>
    .card {
      background-color: #1b263b; /* Slightly lighter dark blue */
      color: #f0f0f0;
      border: none;
      margin-top: 7rem;
      width: 100%;
      max-width: 500px; /* Extended width */
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }

    .form-label {
      color: #f0f0f0; /* Light gray for text visibility */
    }

    .btn-primary {
      background-color: #1d4ed8; /* Bright blue */
      border-color: #1d4ed8;
      color: #f0f0f0; /* White text for visibility */
    }

    .btn-primary:hover {
      background-color: #2563eb; /* Slightly lighter blue */
      border-color: #2563eb;
    }

    a {
      color: #38bdf8; /* Cyan for links */
      text-decoration: none;
      transition: 0.5s ease-in-out;
    }

    a:hover{
      color: white;
    }

    .input-group .form-control {
      border-right: 0;
    }

    .input-group .input-group-text {
      background-color: #1b263b;
      border-left: 0;
      cursor: pointer;
    }

    #togglePassword i {
      color: #ffffff; /* Eye icon color */
    }
  </style>
<div class="container d-flex justify-content-center align-items-center">
    <div class="card p-4">
      <h3 class="text-center mb-4">Login</h3>
      <form method="post" action="/loginuser">
        {% csrf_token %}
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" class="form-control" id="email"  name="email" placeholder="Enter your email" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <input type="password" class="form-control" id="password" name="pass" placeholder="Enter your password" required>
            <span class="input-group-text" id="togglePassword">
              <i class="bi bi-eye" id="passwordIcon"></i>
            </span>
          </div>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary">Login</button>
        </div>
      </form>
      <div class="mt-3 text-center">
        <a href="#">Forgot Password?</a>
      </div>
      <p class="text-center mt-3">
        Don't have an account? <a href="/register">Register</a>
      </p>
    </div>
  </div>

  <!-- JavaScript for Password Toggle -->
  <script>
    document.getElementById('togglePassword').addEventListener('click', function () {
      const passwordField = document.getElementById('password');
      const passwordIcon = document.getElementById('passwordIcon');
      if (passwordField.type === 'password') {
        passwordField.type = 'text';
        passwordIcon.classList.replace('bi-eye', 'bi-eye-slash');
      } else {
        passwordField.type = 'password';
        passwordIcon.classList.replace('bi-eye-slash', 'bi-eye');
      }
    });
  </script>
{% endblock %}
